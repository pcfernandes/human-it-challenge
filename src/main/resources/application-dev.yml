# Development profile (applied automatically when no explicit profile is set).
# Datasource: H2 in-memory. No secrets here - env only:
#   APP_SECURITY_JWT_SECRET (required), APP_SECURITY_DEMO_USER_USERNAME and
#   APP_SECURITY_DEMO_USER_PASSWORD (required because the dev demo-user properties
#   are validated and dev bindings fail fast when absent).
spring:
  datasource:
    url: jdbc:h2:mem:humanit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.humanit.challenge: DEBUG
